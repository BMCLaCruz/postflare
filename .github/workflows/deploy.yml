# Deploys to Cloudflare Workers after CI passes on main (or by hand: Actions → Deploy → Run workflow).
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   an API token scoped to your account with: Workers Scripts Edit, D1 Edit,
#                          Workers R2 Storage Edit, Cloudflare Images Edit, Account Settings Read
#   CLOUDFLARE_ACCOUNT_ID  your account id (dashboard → Workers & Pages, right-hand side)
# Optional secret WRANGLER_LOCAL_JSONC: the contents of your wrangler.local.jsonc (custom domain, vars...).
# Without the token the job is skipped. If Workers Builds is also connected to this repository, disconnect it
# (Worker → Settings → Build) so each push is deployed once.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository != 'FerdiKT/postflare' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping the deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.creds.outputs.ok == 'true'
        with:
          # The commit CI just checked, not whatever main points to now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.creds.outputs.ok == 'true'
      - name: Write wrangler.local.jsonc
        if: steps.creds.outputs.ok == 'true'
        env:
          WRANGLER_LOCAL_JSONC: ${{ secrets.WRANGLER_LOCAL_JSONC }}
        run: |
          if [ -n "$WRANGLER_LOCAL_JSONC" ]; then
            printf '%s\n' "$WRANGLER_LOCAL_JSONC" > wrangler.local.jsonc
          fi
      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        run: npm run deploy
