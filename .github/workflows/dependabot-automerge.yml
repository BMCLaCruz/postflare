# Merges Dependabot's dependency PRs once CI has passed on them, so routine updates need no attention.
# Major versions never get here (dependabot.yml ignores them). Merging to main deploys through Workers Builds.
name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Merge the PR that CI just passed on
        run: |
          pr="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --author app/dependabot --json number --jq '.[0].number // ""')"
          if [ -z "$pr" ]; then
            echo "No open Dependabot PR for $BRANCH"
            exit 0
          fi
          # --match-head-commit: never merge a commit CI has not passed on.
          gh pr merge "$pr" --repo "$REPO" --squash --delete-branch --match-head-commit "$SHA"
