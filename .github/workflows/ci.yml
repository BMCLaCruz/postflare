name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Build CLI
        run: npm run cli:build
      - name: Test
        # Integration tests run in workerd via miniflare: no Cloudflare account or credentials needed.
        run: npx vitest run
      - name: Build
        run: npx vite build
      - name: Test the self-hosters' update script
        run: bash scripts/test-postflare-update.sh
