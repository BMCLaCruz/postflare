version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Minor and patch updates arrive as one weekly PR; major versions are upgraded by hand
    # (they usually need code changes, e.g. vitest-pool-workers follows vitest majors).
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 0.13+ requires vitest 4; upgrade both together by hand.
      - dependency-name: "@cloudflare/vitest-pool-workers"
        versions: [">=0.13.0"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # release.yml reads release-please-action v4 outputs; review the v5 changes before upgrading.
      - dependency-name: "googleapis/release-please-action"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "ci"
